services:
  # خدمة الويب للمنظومة
  - type: web
    name: tripoli-uni-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: student_db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  # إنشاء قاعدة بيانات PostgreSQL تلقائياً
  - name: student_db
    plan: free