{% extends 'base.html' %}
{% block title %}تسجيل الدخول — بوابة جامعة طرابلس{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center">
  <div class="w-full max-w-md">

    <div class="text-center mb-8">
      <!-- Dynamic logo — falls back to the "ج" block if the image is missing -->
      <div class="flex items-center justify-center mb-4">
        <img src="{{ system_logo_url }}"
             alt="شعار جامعة طرابلس"
             style="max-height:120px; width:auto;"
             class="object-contain rounded-2xl"
             onerror="this.style.display='none'; document.getElementById('login-logo-fb').style.display='flex'">
        <div id="login-logo-fb"
             class="w-24 h-24 bg-blue-600 rounded-2xl items-center justify-center text-5xl font-bold select-none hidden"
             style="display:none">ج</div>
      </div>
      <h1 class="text-3xl font-bold text-white">بوابة جامعة طرابلس</h1>
      <p class="text-gray-400 mt-2 text-sm">نظام القبول والتسجيل الإلكتروني</p>
    </div>

    <div class="bg-gray-900 rounded-2xl p-8 border border-gray-800 shadow-2xl">
      <h2 class="text-xl font-bold text-white mb-6">تسجيل الدخول</h2>

      <form method="POST" class="space-y-5">
        <div>
          <label class="block text-gray-300 text-sm mb-2">البريد الإلكتروني</label>
          <input type="email" name="email" required autocomplete="email"
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500
                   focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
            placeholder="example@gmail.com">
        </div>

        <div>
          <label class="block text-gray-300 text-sm mb-2">كلمة المرور</label>
          <input type="password" name="password" required autocomplete="current-password"
            class="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500
                   focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition"
            placeholder="••••••••">
        </div>

        <button type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold py-3 rounded-xl transition">
          دخول
        </button>
      </form>

      <p class="mt-6 text-center text-gray-400 text-sm">
        ليس لديك حساب؟
        <a href="{{ url_for('signup') }}" class="text-blue-400 hover:text-blue-300 transition">إنشاء حساب جديد</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
