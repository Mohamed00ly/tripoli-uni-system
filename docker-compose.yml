version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tripoli_portal_db
    environment:
      POSTGRES_DB: tripoli_portal
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
